name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          cd "$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")"
          gradle assembleDebug
          cp "$(find . -name app-debug.apk | head -1)" "$GITHUB_WORKSPACE/SalahReminder.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Salah Reminder v1.0.${{ github.run_number }}
          files: SalahReminder.apk
          make_latest: true
