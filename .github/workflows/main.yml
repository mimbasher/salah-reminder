name: Build APK

# Branch pushes only — pushing or moving a tag must not kick off another release build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing — updates would not install over each other."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk SalahReminder.apk

      - name: Remove signing key
        if: always()
        run: rm -f keystore.jks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Salah Reminder 2.2.${{ github.run_number }}
          files: SalahReminder.apk
          make_latest: true
          body: |
            Tap **SalahReminder.apk** below to install.

            Already have the app? It checks for this automatically — open it and tap the
            update banner on the home screen.
