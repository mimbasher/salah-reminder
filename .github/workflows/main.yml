name: Build

# Branch pushes only — pushing or moving a tag must not kick off another release build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle testGithubDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 secret is missing — updates would not install over each other."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks

      # Two builds from the same source: the APK people download from the releases page,
      # which can update itself, and the bundle for Google Play, which cannot — Play updates
      # its own apps, and its policy forbids an app that installs code on its own.
      - name: Build signed APK and Play bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleGithubRelease bundlePlayRelease -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/github/release/app-github-release.apk SalahReminder.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab SalahReminder-play.aab

      # Not attached to the release: the store copy is uploaded by hand in the Play Console,
      # and a stray .aab on the releases page is only something to install by mistake.
      - name: Keep the Play bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: SalahReminder-play.aab
          retention-days: 90

      - name: Remove signing key
        if: always()
        run: rm -f keystore.jks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Salah Reminder 2.2.${{ github.run_number }}
          files: SalahReminder.apk
          make_latest: true
          body: |
            Tap **SalahReminder.apk** below to install.

            Already have the app? It checks for this automatically — open it and tap the
            update banner on the home screen.
